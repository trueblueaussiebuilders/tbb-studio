name: Pull Reel insights

on:
  schedule:
    - cron: "17 21 * * *"   # daily, ~8am Melbourne (well clear of the 08:30 UTC post run)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch metrics for every posted Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish/insights.py --out insights.csv

      - name: Commit insights.csv
        run: |
          git config user.name "tbb-bot"
          git config user.email "tbb-bot@users.noreply.github.com"
          git add insights.csv
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Insights $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::Couldn't push insights.csv"; exit 1
