name: Voice test (render a video, don't post)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Video folder to render"
        default: "003-brick-veneer"
      engine:
        description: "Voice engine override (blank = voice.json)"
        default: ""
      builtin:
        description: "Chatterbox: use the built-in voice instead of the sample"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: post            # never overlaps a real post (they share the Pages site)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        env:
          VOICE_ENGINE: ${{ inputs.engine }}
        run: bash tools/install.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: voices-kokoro-v1.0-chatterbox-0.1.7
      - name: Build video
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ENGINE: ${{ inputs.engine }}
          CHATTERBOX_BUILTIN: ${{ inputs.builtin && '1' || '' }}
        run: |
          time python -m engine.build "videos/${{ inputs.slug }}" --out build
          mkdir -p site
          cp "build/${{ inputs.slug }}.mp4" "site/voice-test-${{ github.run_id }}.mp4"
          echo "True Blue Aussie Builders" > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  host:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Link
        run: echo "TEST_VIDEO ${{ steps.deployment.outputs.page_url }}voice-test-${{ github.run_id }}.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
