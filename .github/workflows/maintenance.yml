name: Token refresh + connection check

on:
  schedule:
    - cron: "0 22 * * 0"   # weekly, Monday morning Melbourne
  workflow_dispatch:

jobs:
  check-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Instagram connection
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish/instagram.py check

      - name: Refresh Instagram token (tokens expire after 60 days)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret not set, so the token can't be refreshed automatically. Add it (see README) or regenerate the token in the Meta dashboard before day 60."
            exit 0
          fi
          python3 publish/instagram.py refresh --out /tmp/tok
          [ -s /tmp/tok ] || exit 0
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < /tmp/tok
          rm -f /tmp/tok
